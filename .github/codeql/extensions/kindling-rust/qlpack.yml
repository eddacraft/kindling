# Model pack picked up by GitHub code scanning default setup
# (see `.github/codeql/extensions/` in GitHub's default-setup docs).
# Teaches CodeQL that kindling's secret maskers (cleartext-logging) and
# `validate_db_path` (path-injection) are sanitizers.
name: eddacraft/kindling-rust
version: 0.0.1
library: true
extensionTargets:
  codeql/rust-all: '*'
dataExtensions:
  - models/**/*.yml
